<style>
:root{--bg:#f3f6fa;--ink:#172437;--muted:#69788b;--nav:#12243a;--brand:#177a62;--brand2:#20a07e;--line:#e3eaf1;--card:#fff;--warn:#b7791f;--red:#c24141;--shadow:0 8px 24px rgba(22,38,59,.06)}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Noto Sans Bengali","Segoe UI",sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer}.app{min-height:100vh;display:grid;grid-template-columns:260px 1fr}.sidebar{background:linear-gradient(180deg,#12243a,#1a354e);color:#fff;padding:24px 16px;position:sticky;top:0;height:100vh}.brand{display:flex;gap:12px;align-items:center;margin:0 8px 24px}.brandicon{width:44px;height:44px;border-radius:13px;background:#22a17e;display:grid;place-items:center;font-size:23px}.brand h1{font-size:17px;margin:0}.brand small{color:#b9c9d9}.nav{display:grid;gap:6px}.nav button{border:0;background:transparent;color:#d5e1ec;text-align:left;padding:12px;border-radius:10px;display:flex;gap:12px;align-items:center}.nav button:hover,.nav button.active{background:#28445f;color:white}.nav .ico{width:22px;text-align:center}.sidefoot{position:absolute;bottom:20px;left:18px;right:18px;font-size:12px;color:#aec0d1;line-height:1.65;border-top:1px solid #345069;padding-top:12px}.main{padding:26px 30px;min-width:0}.topbar{display:flex;justify-content:space-between;gap:15px;align-items:center;margin-bottom:22px}.topbar h2{margin:0;font-size:24px}.sub{color:var(--muted);font-size:13px;margin-top:5px}.actions{display:flex;gap:8px;flex-wrap:wrap}.btn{border:1px solid var(--line);background:white;color:var(--ink);padding:9px 13px;border-radius:10px;font-weight:650}.btn.primary{background:var(--brand);border-color:var(--brand);color:white}.btn:hover{filter:brightness(.97)}.cards{display:grid;grid-template-columns:repeat(4,minmax(130px,1fr));gap:14px;margin-bottom:20px}.stat{background:var(--card);padding:17px;border-radius:15px;box-shadow:var(--shadow);border:1px solid var(--line)}.stat .slabel{color:var(--muted);font-size:13px}.stat .num{font-size:27px;font-weight:750;margin:8px 0 0}.stat .hint{font-size:12px;color:var(--muted);margin-top:3px}.panel{background:white;border:1px solid var(--line);border-radius:15px;box-shadow:var(--shadow);padding:18px;margin-bottom:18px}.panelhead{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:14px}.panelhead h3{margin:0;font-size:17px}.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}.search{min-width:190px;flex:1;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:#fff}.tablewrap{overflow:auto}table{border-collapse:collapse;width:100%;min-width:760px}th,td{padding:11px 10px;text-align:left;border-bottom:1px solid var(--line);font-size:13px;vertical-align:top}th{color:#53657a;font-weight:700;background:#f8fafc;position:sticky;top:0}td .muted{display:block;color:var(--muted);font-size:12px;margin-top:3px}.empty{text-align:center;padding:35px;color:var(--muted)}.tag{display:inline-block;padding:4px 8px;border-radius:20px;background:#eaf6f1;color:#176b55;font-size:12px;font-weight:700}.tag.warn{background:#fff4df;color:#8a5a13}.tag.red{background:#fdeaea;color:#a23434}.rowbtn{border:0;background:#f0f4f8;padding:5px 8px;border-radius:7px;margin-right:4px;color:#33465a}.two{display:grid;grid-template-columns:1.15fr .85fr;gap:18px}.reminder{padding:12px;border:1px solid var(--line);border-radius:10px;margin-bottom:9px;display:flex;justify-content:space-between;gap:10px}.reminder strong{display:block}.reminder small{color:var(--muted)}.quick{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.quick button{padding:14px;border:1px solid var(--line);background:#f9fbfd;border-radius:11px;text-align:left;font-weight:650;color:#23374d}.quick button span{font-size:20px;display:block;margin-bottom:5px}.modalback{position:fixed;inset:0;background:rgba(10,20,34,.5);display:none;align-items:center;justify-content:center;padding:16px;z-index:10}.modalback.show{display:flex}.modal{width:min(780px,100%);max-height:90vh;overflow:auto;background:#fff;border-radius:16px;padding:20px;box-shadow:0 20px 70px #0a142c50}.modalhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}.modalhead h3{margin:0}.close{border:0;background:#f1f4f8;border-radius:8px;padding:7px 10px}.formgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.field{display:flex;flex-direction:column;gap:5px}.field.full{grid-column:1/-1}.field label{font-size:13px;color:#53657a;font-weight:650}.field input,.field select,.field textarea{padding:10px;border:1px solid var(--line);border-radius:9px;background:#fff;min-width:0}.field textarea{min-height:84px;resize:vertical}.modalfooter{display:flex;justify-content:flex-end;gap:8px;margin-top:16px}.notice{padding:12px;background:#eef7f4;border:1px solid #d2e9df;color:#225a49;border-radius:10px;font-size:13px;margin-bottom:15px}.danger{color:var(--red)}.footer{color:#8a98a8;text-align:center;font-size:12px;padding:12px}.hidden{display:none!important}@media(max-width:900px){.app{grid-template-columns:1fr}.sidebar{position:relative;height:auto;padding:12px}.brand{margin-bottom:12px}.nav{grid-template-columns:repeat(3,1fr)}.nav button{padding:9px;font-size:13px}.sidefoot{display:none}.main{padding:18px}.cards{grid-template-columns:repeat(2,1fr)}.two{grid-template-columns:1fr}}@media(max-width:560px){.topbar{align-items:flex-start;flex-direction:column}.formgrid{grid-template-columns:1fr}.field.full{grid-column:auto}.cards{gap:9px}.stat{padding:13px}.stat .num{font-size:23px}.nav{grid-template-columns:repeat(2,1fr)}}

<body><div class="app">
<aside class="sidebar"><div class="brand"><div class="brandicon">⚖</div><div><h1>জুয়েল চৌধুরী</h1><small>সালিশ • দলিল • জমি ব্যবস্থাপনা</small></div></div>
<nav class="nav" id="nav"><button class="active" data-view="dashboard"><span class="ico">▦</span>ড্যাশবোর্ড</button><button data-view="salish"><span class="ico">⚖</span>সালিশ রেজিস্টার</button><button data-view="deed"><span class="ico">📄</span>দলিল ও চুক্তি</button><button data-view="land"><span class="ico">🗺</span>জমি ও বিরোধ</button><button data-view="people"><span class="ico">👥</span>ব্যক্তি রেজিস্টার</button><button data-view="reminders"><span class="ico">🔔</span>স্মরণিকা / তারিখ</button><button data-view="finance"><span class="ico">৳</span>টাকা-পয়সার হিসাব</button><button data-view="backup"><span class="ico">💾</span>ব্যাকআপ ও সেটিংস</button></nav>
<div class="sidefoot">ব্যক্তিগত কাজের নথি সংরক্ষণ<br>অফলাইন ব্যবহারের জন্য তৈরি<br>ডেটা এই ব্রাউজারেই থাকে</div></aside>
<main class="main"><header class="topbar"><div><h2 id="viewTitle">ড্যাশবোর্ড</h2><div class="sub" id="viewSub">আপনার কাজ, গুরুত্বপূর্ণ তারিখ ও অগ্রগতি এক নজরে</div></div><div class="actions"><button class="btn" onclick="exportData()">⬇ ব্যাকআপ</button><button class="btn primary" id="newBtn" onclick="openForm('salish')">＋ নতুন এন্ট্রি</button></div></header><div id="content"></div><div class="footer">Jewel Chowdhury Legal & Salish Manager Pro · তথ্য স্থানীয় ব্রাউজারে সংরক্ষিত</div></main></div>
<div class="modalback" id="modalback"><div class="modal"><div class="modalhead"><h3 id="formTitle">নতুন তথ্য</h3><button class="close" onclick="closeForm()">✕</button></div><form id="entryForm"><div class="formgrid" id="formFields"></div><div class="modalfooter"><button type="button" class="btn" onclick="closeForm()">বাতিল</button><button class="btn primary" type="submit">সংরক্ষণ করুন</button></div></form></div></div>
<script>
const STORE='jewelSalishManagerPro_v1';let db=load(),view='dashboard',editing=null,formModule='salish';function load(){try{return JSON.parse(localStorage.getItem(STORE))||blank()}catch(e){return blank()}}function blank(){return{salish:[],deed:[],land:[],people:[],reminders:[],finance:[]}}function save(){localStorage.setItem(STORE,JSON.stringify(db));render()}
const modules={salish:{title:'সালিশ রেজিস্টার',fields:[['caseNo','সালিশ/রেজিস্টার নং'],['date','সালিশের তারিখ','date'],['nextDate','পরবর্তী তারিখ','date'],['place','সালিশের স্থান'],['plaintiff','বাদী / আবেদনকারী'],['defendant','বিবাদী'],['phone','যোগাযোগ নম্বর'],['subject','বিরোধের বিষয়'],['statements','উভয় পক্ষের বক্তব্য','textarea'],['witness','সাক্ষী / উপস্থিত ব্যক্তি'],['decision','সিদ্ধান্ত / রায়','textarea'],['status','অবস্থা','select',['চলমান','নিষ্পত্তি','পরবর্তী শুনানি','অনুপস্থিতি']],['notes','বিশেষ নোট','textarea']]},deed:{title:'দলিল ও চুক্তি',fields:[['type','দলিলের ধরন','select',['বায়নানামা','সাফ-কবলা / বিক্রয়','হেবা','বণ্টননামা','ওয়ারিশ / ফরায়েজ','চুক্তিপত্র','অন্যান্য']],['date','তারিখ','date'],['client','গ্রাহক / পক্ষের নাম'],['otherParty','অপর পক্ষ'],['phone','মোবাইল'],['property','সম্পত্তির বিবরণ','textarea'],['amount','মোট মূল্য / ফি (৳)','number'],['paid','পরিশোধ (৳)','number'],['due','বাকি (৳)','number'],['status','অবস্থা','select',['খসড়া','কাজ চলমান','স্বাক্ষর অপেক্ষমাণ','সম্পন্ন']],['deadline','সম্পন্ন করার তারিখ','date'],['notes','নোট','textarea']]},land:{title:'জমি ও বিরোধ',fields:[['owner','মালিক / দাবিদার'],['mouza','মৌজা'],['jl','জে.এল. নং'],['khatian','খতিয়ান নং'],['dag','দাগ নং'],['area','জমির পরিমাণ'],['unit','একক','select',['শতক','কড়া','গণ্ডা','একর','বিঘা','অন্যান্য']],['type','জমির শ্রেণি'],['boundary','চৌহদ্দি','textarea'],['issue','বিরোধ / সমস্যা','textarea'],['related','সংশ্লিষ্ট ব্যক্তি / মামলা'],['status','অবস্থা','select',['বিরোধ চলমান','সালিশাধীন','নিষ্পত্তি','দলিল প্রয়োজন']],['notes','নোট','textarea']]},people:{title:'ব্যক্তি রেজিস্টার',fields:[['name','নাম'],['father','পিতা / স্বামী'],['address','ঠিকানা','textarea'],['phone','মোবাইল'],['relation','সংশ্লিষ্টতা','select',['বাদী','বিবাদী','সাক্ষী','গ্রাহক','দলিলের পক্ষ','অন্যান্য']],['identity','পরিচিতি / রেফারেন্স'],['notes','নোট','textarea']]},reminders:{title:'স্মরণিকা / তারিখ',fields:[['title','কাজ / স্মরণিকার বিষয়'],['date','তারিখ','date'],['time','সময়','time'],['related','সংশ্লিষ্ট ব্যক্তি / সালিশ / দলিল'],['phone','যোগাযোগ নম্বর'],['status','অবস্থা','select',['বাকি','সম্পন্ন','স্থগিত']],['notes','নোট','textarea']]},finance:{title:'টাকা-পয়সার হিসাব',fields:[['date','তারিখ','date'],['person','ব্যক্তি / পক্ষ'],['category','হিসাবের ধরন','select',['দলিল ফি','সালিশ ফি','জমা','খরচ','অন্যান্য']],['description','বিবরণ'],['amount','টাকার পরিমাণ (৳)','number'],['paid','প্রাপ্ত / পরিশোধ (৳)','number'],['due','বাকি (৳)','number'],['method','লেনদেন পদ্ধতি'],['notes','নোট','textarea']]}};
const labels={dashboard:['ড্যাশবোর্ড','আপনার কাজ, গুরুত্বপূর্ণ তারিখ ও অগ্রগতি এক নজরে'],salish:['সালিশ রেজিস্টার','সালিশের পক্ষ, বক্তব্য, সিদ্ধান্ত ও পরবর্তী তারিখ'],deed:['দলিল ও চুক্তি','দলিলের খসড়া, ফি, জমা, বাকি ও কাজের অবস্থা'],land:['জমি ও বিরোধ','মৌজা, খতিয়ান, দাগ, জমির পরিমাণ ও বিরোধের তথ্য'],people:['ব্যক্তি রেজিস্টার','সংশ্লিষ্ট ব্যক্তিদের তথ্য ও কাজের ইতিহাস'],reminders:['স্মরণিকা / তারিখ','পরবর্তী সালিশ, সাক্ষাৎ ও কাজের ডেডলাইন'],finance:['টাকা-পয়সার হিসাব','আয়, জমা, খরচ ও বাকি টাকার রেকর্ড'],backup:['ব্যাকআপ ও সেটিংস','ডেটা রপ্তানি, আমদানি ও নিরাপদে সংরক্ষণ']};
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function fmtdate(v){if(!v)return '—';try{return new Date(v+'T00:00:00').toLocaleDateString('bn-BD',{year:'numeric',month:'short',day:'numeric'})}catch{return v}}function money(v){return (Number(v)||0).toLocaleString('bn-BD')+' ৳'}function id(){return Date.now().toString(36)+Math.random().toString(36).slice(2,7)}
function go(v){view=v;document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('active',b.dataset.view===v));document.getElementById('viewTitle').textContent=labels[v][0];document.getElementById('viewSub').textContent=labels[v][1];document.getElementById('newBtn').style.display=v==='dashboard'||v==='backup'?'none':'';document.getElementById('newBtn').onclick=()=>openForm(v==='dashboard'?'salish':v);render()}
document.getElementById('nav').addEventListener('click',e=>{let b=e.target.closest('button[data-view]');if(b)go(b.dataset.view)});
function render(){let c=document.getElementById('content');if(view==='dashboard')c=dashboard();else if(view==='backup')c=backupPage();else c=tablePage(view);document.getElementById('content').innerHTML=c}
function dashboard(){let total=Object.values(db).reduce((s,a)=>s+a.length,0),openS=db.salish.filter(x=>x.status!=='নিষ্পত্তি').length,openD=db.deed.filter(x=>x.status!=='সম্পন্ন').length,rem=db.reminders.filter(x=>x.status!=='সম্পন্ন');let upcoming=[...db.reminders,...db.salish.filter(x=>x.nextDate).map(x=>({...x,title:'সালিশ: '+(x.caseNo||x.plaintiff||''),date:x.nextDate,related:x.defendant,status:'বাকি'})),...db.deed.filter(x=>x.deadline).map(x=>({...x,title:'দলিল সম্পন্ন করুন: '+(x.client||x.type),date:x.deadline,status:x.status}))].filter(x=>x.date&&x.status!=='সম্পন্ন').sort((a,b)=>a.date.localeCompare(b.date)).slice(0,6);return `<div class="cards"><div class="stat"><div class="slabel">মোট রেকর্ড</div><div class="num">${total.toLocaleString('bn-BD')}</div><div class="hint">সব মডিউল মিলিয়ে</div></div><div class="stat"><div class="slabel">চলমান সালিশ</div><div class="num">${openS.toLocaleString('bn-BD')}</div><div class="hint">নিষ্পত্তি হয়নি</div></div><div class="stat"><div class="slabel">অসম্পূর্ণ দলিল</div><div class="num">${openD.toLocaleString('bn-BD')}</div><div class="hint">কাজ শেষ হয়নি</div></div><div class="stat"><div class="slabel">বাকি স্মরণিকা</div><div class="num">${rem.length.toLocaleString('bn-BD')}</div><div class="hint">পরবর্তী করণীয়</div></div></div><div class="two"><section class="panel"><div class="panelhead"><h3>📅 আসন্ন তারিখ ও করণীয়</h3><button class="btn" onclick="go('reminders')">সব দেখুন</button></div>${upcoming.length?upcoming.map(x=>`<div class="reminder"><div><strong>${esc(x.title||x.caseNo||'করণীয়')}</strong><small>${esc(x.related||x.plaintiff||'')} · ${fmtdate(x.date)}</small></div><span class="tag ${x.date<today()?'red':'warn'}">${x.date<today()?'তারিখ পেরিয়েছে':'আসন্ন'}</span></div>`).join(''):'<div class="empty">কোনো আসন্ন তারিখ নেই। স্মরণিকা যোগ করে রাখুন।</div>'}</section><section class="panel"><div class="panelhead"><h3>⚡ দ্রুত নতুন এন্ট্রি</h3></div><div class="quick"><button onclick="openForm('salish')"><span>⚖️</span>নতুন সালিশ</button><button onclick="openForm('deed')"><span>📄</span>নতুন দলিল</button><button onclick="openForm('land')"><span>🗺️</span>জমির তথ্য</button><button onclick="openForm('reminders')"><span>🔔</span>স্মরণিকা যোগ</button></div></section></div><section class="panel"><div class="panelhead"><h3>সাম্প্রতিক রেকর্ড</h3></div>${recentTable()}</section>`}
function recentTable(){let arr=[];Object.keys(modules).forEach(k=>db[k].forEach(x=>arr.push({...x,module:k})));arr.sort((a,b)=>(b.created||'').localeCompare(a.created||''));arr=arr.slice(0,6);return arr.length?`<div class="tablewrap"><table><thead><tr><th>ধরন</th><th>মূল তথ্য</th><th>তারিখ</th><th>অবস্থা</th></tr></thead><tbody>${arr.map(x=>`<tr><td>${modules[x.module].title}</td><td><strong>${esc(x.caseNo||x.title||x.client||x.owner||x.name||x.person||x.description||'রেকর্ড')}</strong><span class="muted">${esc(x.subject||x.type||x.mouza||x.category||'')}</span></td><td>${fmtdate(x.date)}</td><td>${esc(x.status||'—')}</td></tr>`).join('')}</tbody></table></div>`:'<div class="empty">এখনো কোনো তথ্য যোগ করা হয়নি।</div>'}
function tablePage(k){let rows=db[k],m=modules[k];return `<section class="panel"><div class="toolbar"><input class="search" id="search" placeholder="নাম, বিষয়, দাগ, নম্বর বা নোট দিয়ে খুঁজুন…" oninput="filterRows()"><button class="btn primary" onclick="openForm('${k}')">＋ নতুন ${m.title}</button></div><div class="tablewrap" id="tablebox">${makeTable(k,rows)}</div></section>`}
function makeTable(k,rows){if(!rows.length)return '<div class="empty">এই বিভাগে কোনো তথ্য নেই। নতুন এন্ট্রি যোগ করুন।</div>';let fields=modules[k].fields;let mainFields=fields.slice(0,4);return `<table><thead><tr>${mainFields.map(f=>`<th>${f[1]}</th>`).join('')}<th>অবস্থা</th><th>কাজ</th></tr></thead><tbody>${rows.map(x=>`<tr data-search="${esc(JSON.stringify(x).toLowerCase())}">${mainFields.map(f=>`<td>${esc(x[f[0]]||'—')}${f[0]==='date'&&x[f[0]]?`<span class="muted">${fmtdate(x[f[0]])}</span>`:''}</td>`).join('')}<td>${x.status?`<span class="tag ${x.status==='নিষ্পত্তি'||x.status==='সম্পন্ন'?'':'warn'}">${esc(x.status)}</span>`:'—'}</td><td><button class="rowbtn" onclick="showDetails('${k}','${x.id}')">বিস্তারিত</button><button class="rowbtn" onclick="editEntry('${k}','${x.id}')">সম্পাদনা</button><button class="rowbtn danger" onclick="delEntry('${k}','${x.id}')">মুছুন</button></td></tr>`).join('')}</tbody></table>`}
function filterRows(){let q=document.getElementById('search').value.toLowerCase();document.querySelectorAll('#tablebox tbody tr').forEach(r=>r.style.display=r.dataset.search.includes(q)?'':'none')}
function openForm(k,record=null){formModule=k;editing=record;let m=modules[k];document.getElementById('formTitle').textContent=(record?'সম্পাদনা: ':'নতুন ')+m.title;let fields=document.getElementById('formFields');fields.innerHTML=m.fields.map(f=>{let [key,label,type,opts]=f;let val=record?.[key]??'';let full=type==='textarea';let input=type==='textarea'?`<textarea name="${key}">${esc(val)}</textarea>`:type==='select'?`<select name="${key}"><option value="">-- নির্বাচন করুন --</option>${opts.map(o=>`<option ${val===o?'selected':''}>${o}</option>`).join('')}</select>`:`<input name="${key}" type="${type||'text'}" value="${esc(val)}" ${type==='number'?'step="any"':''}>`;return `<div class="field ${full?'full':''}"><label>${label}</label>${input}</div>`}).join('');document.getElementById('modalback').classList.add('show')}
function closeForm(){document.getElementById('modalback').classList.remove('show');editing=null}document.getElementById('entryForm').addEventListener('submit',e=>{e.preventDefault();let data=Object.fromEntries(new FormData(e.target).entries());if(formModule==='deed'||formModule==='finance'){if(data.amount!==undefined&&data.paid!==undefined&&data.due==='')data.due=Math.max(0,Number(data.amount)-Number(data.paid));}if(editing){let i=db[formModule].findIndex(x=>x.id===editing.id);data={...db[formModule][i],...data,updated:new Date().toISOString()};db[formModule][i]=data}else db[formModule].unshift({...data,id:id(),created:new Date().toISOString()});closeForm();save()});
function editEntry(k,i){let r=db[k].find(x=>x.id===i);openForm(k,r)}function delEntry(k,i){if(confirm('এই রেকর্ডটি মুছে ফেলবেন?')){db[k]=db[k].filter(x=>x.id!==i);save()}}function showDetails(k,i){let x=db[k].find(r=>r.id===i);let content=modules[k].fields.map(f=>`<p><b>${f[1]}:</b> ${esc(x[f[0]]||'—')}</p>`).join('');let d=document.createElement('div');d.innerHTML=`<div class="modalback show"><div class="modal"><div class="modalhead"><h3>${modules[k].title} — বিস্তারিত</h3><button class="close" onclick="this.closest('.modalback').remove()">✕</button></div>${content}<div class="modalfooter"><button class="btn primary" onclick="editEntry('${k}','${i}');this.closest('.modalback').remove()">সম্পাদনা</button></div></div></div>`;document.body.append(d)}
function today(){return new Date().toISOString().slice(0,10)}
function backupPage(){return `<section class="panel"><h3>💾 ডেটা ব্যাকআপ</h3><div class="notice">আপনার সব তথ্য এই ব্রাউজারের লোকাল স্টোরেজে সংরক্ষিত থাকে। ব্রাউজার ডেটা মুছে গেলে তথ্য হারাতে পারে। নিয়মিত JSON ব্যাকআপ ডাউনলোড করে নিরাপদ স্থানে রাখুন।</div><div class="actions"><button class="btn primary" onclick="exportData()">⬇ সম্পূর্ণ ব্যাকআপ ডাউনলোড</button><label class="btn">⬆ ব্যাকআপ ফিরিয়ে আনুন<input type="file" accept=".json,application/json" onchange="importData(event)" hidden></label><button class="btn danger" onclick="clearAll()">সব ডেটা মুছুন</button></div><hr style="border:0;border-top:1px solid var(--line);margin:20px 0"><h3>📌 ব্যবহারের পরামর্শ</h3><ul><li>প্রতিটি সালিশের পর বক্তব্য, সিদ্ধান্ত ও পরবর্তী তারিখ লিখে রাখুন।</li><li>দলিলের বাকি টাকা ও সম্পন্ন করার সময়সীমা আপডেট রাখুন।</li><li>জমির তথ্য লিখলে মৌজা, খতিয়ান, দাগ ও পরিমাণ একসঙ্গে দিন।</li><li>মোবাইল পরিবর্তন বা ব্রাউজার ডেটা ক্লিয়ার করার আগে ব্যাকআপ নিন।</li><li>সংবেদনশীল নথি রাখলে ফোন/কম্পিউটার লক এবং নিরাপদ ব্যাকআপ ব্যবহার করুন।</li></ul><p><b>রেকর্ড সংখ্যা:</b> ${Object.values(db).reduce((s,a)=>s+a.length,0).toLocaleString('bn-BD')}</p></section>`}
function exportData(){let blob=new Blob([JSON.stringify({app:'Jewel Legal Salish Manager Pro',version:1,exported:new Date().toISOString(),data:db},null,2)],{type:'application/json'});let a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='jewel-salish-backup-'+today()+'.json';a.click();URL.revokeObjectURL(a.href)}function importData(e){let f=e.target.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{try{let o=JSON.parse(r.result);let d=o.data||o;if(!Object.keys(blank()).every(k=>Array.isArray(d[k])))throw Error('ফাইলের ফরম্যাট সঠিক নয়');if(confirm('ব্যাকআপের তথ্য বর্তমান ডেটার জায়গায় বসবে। চালিয়ে যাবেন?')){db=d;save();alert('ব্যাকআপ সফলভাবে ফিরিয়ে আনা হয়েছে।')}}catch(err){alert('ব্যাকআপ ফাইলটি পড়া যায়নি: '+err.message)}};r.readAsText(f)}function clearAll(){if(confirm('সতর্কতা: সব রেকর্ড মুছে যাবে। আগে ব্যাকআপ নিয়েছেন?'))if(confirm('নিশ্চিতভাবে সব ডেটা মুছবেন?')){db=blank();save()}}
render();
</script></body></html>
